name: Deploy to Cloudflare Pages

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history and tags: the IndexNow step diffs this tag against the previous one.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # zh/ja/ko OG images need a CJK font; generate-og.mjs exits 1 on CI without one.
      - name: Install Noto CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

      - run: npm run build
        env:
          PUBLIC_ADSENSE_PUBLISHER_ID: ${{ secrets.PUBLIC_ADSENSE_PUBLISHER_ID }}
          PUBLIC_ADSENSE_SLOT_TOP: ${{ secrets.PUBLIC_ADSENSE_SLOT_TOP }}
          PUBLIC_ADSENSE_SLOT_MID: ${{ secrets.PUBLIC_ADSENSE_SLOT_MID }}
          PUBLIC_ADSENSE_SLOT_BOTTOM: ${{ secrets.PUBLIC_ADSENSE_SLOT_BOTTOM }}
          PUBLIC_GA4_MEASUREMENT_ID: ${{ secrets.PUBLIC_GA4_MEASUREMENT_ID }}

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx wrangler pages project list 2>&1 | grep -Fq "zerotool-dev"; then
            echo "Project zerotool-dev already exists, skipping create."
          else
            npx wrangler pages project create zerotool-dev --production-branch master
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=zerotool-dev --branch=master

      # Tell IndexNow engines (Bing and others) which pages changed since the previous
      # tag. Waits for the live key file first. A failure is marked as an error in the
      # log but does not fail the deploy. The key is public by protocol; no secret.
      - name: Submit changed URLs to IndexNow
        continue-on-error: true
        timeout-minutes: 10
        run: node scripts/indexnow-submit.mjs --to "$GITHUB_REF_NAME"
